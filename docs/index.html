e:"The Feelings Weather Report",emoji:"🌦️",story:"Before the big swim, Remi's tummy felt fizzy — like storm clouds rumbling inside! Coach said something clever: “Feelings are like weather. They visit… and then they pass.”",question:"When a big feeling visits, what's a super first move?",choices:[{emoji:"🙈",label:"Hide the feeling away",response:"Hidden feelings grow bigger in the dark! Naming them out loud — “I feel nervous” — makes them shrink. Try it!"},{emoji:"🌦️",label:"Name the weather: “I feel nervous”",best:!0,response:"YES! Naming a feeling is like opening an umbrella — the weather is still there, but now YOU'RE in charge!"},{emoji:"🏃",label:"Run away from it",response:"A little break can help! And naming the feeling first — “I'm frustrated” — makes the break work twice as well."}],mission:"Hold a Feelings Weather Report at dinner: everyone shares their weather — sunny, stormy, foggy, rainbow…",parentPrompt:"Share your own weather first. Kids open up when grown-ups go first."},{week:2,stage:"Knowing Me",stageEmoji:"💛",title:"My Strengths Treasure",emoji:"💎",story:"Pip the Duckling missed the ball and quacked, “I'll never be good at ANYTHING!” Remi opened an imaginary treasure chest: “Pip — fastest swimmer in the pond, kindest friend on the team, and the best tryer I know. That's treasure!”",question:"What's the treasure-chest truth?",choices:[{emoji:"💭",label:"One miss means you're not good at it",response:"One miss is just one wave 🌊 — every champion has missed a thousand times. The treasure truth is “I'm still learning!”"},{emoji:"💎",label:"Everyone has strengths — name three!",best:!0,response:"YES! A sporty one, a kind one, a just-you one. That treasure belongs to you forever, and nobody can take it."},{emoji:"🤐",label:"Better not to think about it",response:"Thinking about strengths is like polishing treasure — it makes them shine brighter. Name one right now, out loud!"}],mission:"Make a Strengths Treasure list of three things: one sporty, one kind, one that's just-you.",parentPrompt:"Add one strength YOU see in them. Kids remember those words forever."},{week:3,stage:"Knowing Me",stageEmoji:"💛",title:"Brave Body, Strong Voice",emoji:"🦁",story:"Remi stood at the top of the big slide with wobbly knees. Then he remembered the Lion Stance: back tall, chin up, paws steady, one deep breath. Wobbly knees… gone!",question:"What does brave look like on the outside?",choices:[{emoji:"🧍",label:"Head down, tiny voice",response:"Even lions feel small sometimes! Try the Lion Stance — tall back, chin up — and feel how your body teaches your heart."},{emoji:"🦁",label:"Stand tall, chin up, steady voice",best:!0,response:"That's the Lion Stance! Your body can teach your heart to feel brave — it works even when your tummy has butterflies."},{emoji:"😤",label:"Puff up and act tough",response:"Brave isn't loud or tough — it's tall, calm and steady. Quiet lions are still lions!"}],mission:"Practice the Lion Stance in the mirror: tall body, deep breath, then say “I've got this!” three times.",parentPrompt:"Do it together — silly versions and serious versions both count."},{week:4,stage:"Knowing Me",stageEmoji:"💛",title:"The Magic Word: YET",emoji:"✨",story:"Pip flopped onto the grass: “I can't do a cartwheel.” Remi grinned and added one tiny magic word: “You can't do a cartwheel… YET.” Pip's eyes went wide. YET changes everything.",question:"Pip says “I can't skip rope.” What's the magic fix?",choices:[{emoji:"✨",label:"Add the magic word: “…YET!”",best:!0,response:"YES! YET turns a wall into a door. Every skipper on Earth started as a tripper."},{emoji:"🚪",label:"Give up — skipping isn't for Pip",response:"Every skill ever learned started with “can't.” YET keeps the door open — and doors are for walking through!"},{emoji:"😠",label:"Try harder and get mad",response:"Big effort is brilliant — but big frustration makes wobbly hands. Breathe, say YET, try again slowly."}],mission:"Catch one “can't” this week and add YET out loud. Grown-ups' cants count too!",parentPrompt:"Model it: “I can't fold fitted sheets… yet.” Let them catch YOUR cants."},{week:5,stage:"Standing Strong",stageEmoji:"🛡️",title:"My Safety Team",emoji:"🛡️",story:"Every hero has a team! Remi's Safety Team is Mama Otter, Coach, and Grandpa River. When anything feels wrong, scary or unkind — the team ALWAYS wants to know. That's what teams are for.",question:"Who belongs on a Safety Team?",choices:[{emoji:"🛡️",label:"Trusted grown-ups who listen — name three!",best:!0,response:"YES! Say their names out loud so they're ready in your pocket. Telling your team is a hero move — every single time."},{emoji:"🤖",label:"Nobody — heroes handle everything alone",response:"Even the mightiest heroes call for backup! Telling your team makes you stronger, never smaller."},{emoji:"🎲",label:"Anyone at all",response:"Your team is special: grown-ups who listen AND help. Let's pick the exact three — one at home, one at school, one more."}],mission:"Build your Safety Team: name (or draw!) three trusted grown-ups — home, school, and one more.",parentPrompt:"Make the list real together: “Yes — you can always, always tell Ms. Lee.”",safetyNote:"Grown-ups: if unkindness or bullying is happening right now, please loop in school and your trusted adults directly. These quests support those conversations — they never replace them."},{week:6,stage:"Standing Strong",stageEmoji:"🛡️",title:"The Strong Stop",emoji:"✋",story:"At practice, a kid kept grabbing Remi's ball and calling him “slowpoke.” Remi's cheeks went hot. Coach taught him the Strong Stop: stand tall, hand up, calm voice — “Stop. I don't like that.”",question:"What could Remi do?",choices:[{emoji:"😤",label:"Grab it back and shout",response:"Feeling angry is completely okay! But grabbing back can tangle things worse. The Strong Stop — tall, calm, clear — is the real power move."},{emoji:"✋",label:"Stand tall: “Stop. I don't like that.”",best:!0,response:"YES! Tall body, calm voice, clear words. That's courage you can practice — and it surprises unkindness every time."},{emoji:"🤫",label:"Stay quiet and hope it stops",response:"Wanting peace is kind — and you deserve help too. A Strong Stop plus telling your Safety Team works even better."}],mission:"Practice the Strong Stop at home: tall stance, hand up, calm voice — “Stop. I don't like that.”",parentPrompt:"Play the silly villain so they can practice on you. Laugh together, then run it once seriously."},{week:7,stage:"Standing Strong",stageEmoji:"🛡️",title:"Walk Tall, Tell Tall",emoji:"🚶",story:"The Strong Stop didn't work — the unkind words kept coming. So Remi used move two: he walked tall (no running, no crying needed, though crying is always allowed) straight to Coach, and told.",question:"Is telling a grown-up “tattling”?",choices:[{emoji:"🚶",label:"No — telling keeps someone safe. That's brave.",best:!0,response:"Exactly! Tattling is trying to get someone INTO trouble. Telling is getting someone OUT of trouble. Heroes tell."},{emoji:"🤐",label:"Yes — better to stay quiet",response:"Quiet lets unkindness grow in the dark. Telling your Safety Team turns the lights on — it's a hero move, every time."},{emoji:"😡",label:"No — but yelling back works better",response:"Your voice matters! And your Safety Team has grown-up powers you don't have yet. Walk tall, tell tall — let the team do the heavy lifting."}],mission:"Practice the two-step with a grown-up: Strong Stop → Walk tall & tell. Make it a game!",parentPrompt:"Say this promise out loud: “If you tell me, I will listen and help — and you will never be in trouble for telling.”"},{week:8,stage:"Standing Strong",stageEmoji:"🛡️",title:"The Buddy Shield",emoji:"🤝",story:"Remi noticed something magic: unkindness goes quiet around buddies. At the new class, he found one friendly face, said “hi, I'm Remi!” — and suddenly the room felt twice as safe.",question:"First day somewhere new and feeling wobbly — what's the move?",choices:[{emoji:"🤝",label:"Find one friendly face and stick together",best:!0,response:"YES! One buddy is a shield, a cheer squad and a friend all at once. And your hello might be THEIR buddy shield too!"},{emoji:"🧍",label:"Stay alone in the corner",response:"Corners feel safe but lonely. One small “hi” to one kind face changes the whole room — and you only need one."},{emoji:"🎭",label:"Act like someone else to fit in",response:"You being YOU is the best teammate anyone could get. One real buddy beats ten pretend ones."}],mission:"Say hi first to one kid at school or practice this week. Just one “hi” — that's the whole mission.",parentPrompt:"Afterwards ask: “Who did you play with today?” Celebrate the trying, whatever happened."},{week:9,stage:"Lifting Others",stageEmoji:"🌟",title:"The Upstander Move",emoji:"🦸",story:"At the park, Remi saw a kid being called names. His tummy went tight — it wasn't even happening to HIM, but it hurt to watch. Then he remembered: heroes don't watch. Heroes get backup.",question:"You SEE someone being treated unkindly. What's the Upstander Move?",choices:[{emoji:"🦸",label:"Get a grown-up, then be a friend to the kid",best:!0,response:"That's the Upstander Move! Bring grown-up backup first, then bring your kindness: “Want to play with us?” changes someone's whole day."},{emoji:"👀",label:"Watch and do nothing",response:"Watching feels safer — but the kid feels all alone. Even the smallest move, like fetching help or a kind word after, changes everything."},{emoji:"🥊",label:"Jump in and fight",response:"Your brave heart is showing! But grown-up backup beats fists every time. Heroes bring help, not more storm."}],mission:"Make a family Upstander Plan: talk through exactly what you'd do if you SAW unkindness happen.",parentPrompt:"Tell them about a time you stood up for someone — or a time you wish you had. Real stories stick."},{week:10,stage:"Lifting Others",stageEmoji:"🌟",title:"The Includer",emoji:"🌈",story:"Remi spotted a kid sitting alone at break, hugging their knees. Remi walked over and used the five magic words every leader knows: “Want to play with us?”",question:"What are the five magic words?",choices:[{emoji:"🌈",label:"“Want to play with us?”",best:!0,response:"That's them! Five words, three seconds, and someone's whole day turns around. Includers are the real team captains."},{emoji:"🙈",label:"Someone else will invite them",response:"Everyone thinks that — so often nobody does! Leaders go first. And going first gets easier every time."},{emoji:"👑",label:"Only invite the best players",response:"The best teams aren't the best players — they're the ones where everyone gets to play. That's what makes people follow a leader."}],mission:"Use the five magic words once this week: “Want to play with us?”",parentPrompt:"At dinner, ask: “Did anyone look left out today?” Noticing is the first leadership skill."},{week:11,stage:"Lifting Others",stageEmoji:"🌟",title:"Captain Kindness",emoji:"👑",story:"Coach picked Remi to lead the warm-up game! Remi explained the rules slowly, gave everyone a turn, and cheered the loudest for the kid who came last. Afterwards, everyone wanted Remi as captain again.",question:"What makes a captain everyone wants to follow?",choices:[{emoji:"👑",label:"Fair turns, big cheers, everyone plays",best:!0,response:"YES! Captains aren't the loudest or the fastest — they're the ones who make everyone else feel ten feet tall."},{emoji:"📢",label:"Bossing everyone loudly",response:"Loud gets attention, kind gets followers. Try swapping one order for one cheer and watch what happens!"},{emoji:"🥇",label:"Winning at any cost",response:"Winning feels great — but a captain who cheers the last-place kid wins something bigger: the whole team's heart."}],mission:"Lead one family game start to finish: explain the rules, give fair turns, cheer everyone.",parentPrompt:"Be a player, not the boss — let them run the whole thing, wobbles and all."},{week:12,stage:"Lifting Others",stageEmoji:"🌟",title:"My Courage Story",emoji:"📖",story:"Remi ? Walk back — backwards!"}],timer:{mode:"stopwatch",label:"Time the tightrope crossing!"},levelUp:"Carry a spoon with a sock ball on it — the circus's hardest act!"},{id:"animal-yoga",title:"Animal Yoga",emoji:"🧘",domain:"stability",youllNeed:"A mat, carpet or towel",steps:[{emoji:"🐻",text:"Bear pose: hands and feet down, hips high, hold strong"},{emoji:"🦩",text:"Flamingo: one leg up, wings wide, steady breathing"},{emoji:"🐕",text:"Puppy stretch to finish — which pose felt strongest?"}],timer:{mode:"stopwatch",label:"Time the longest hold!"},levelUp:"Flow bear → flamingo → puppy without a wobble between poses!"},{id:"pillow-mountain",title:"Pillow Mountain",emoji:"🏔️",domain:"stability",youllNeed:"A path of pillows, cushions and folded blankets",steps:[{emoji:"⛰️",text:"Build a wobbly mountain path across the floor"},{emoji:"🥾",text:"Cross it slowly — squishy ground tests super-balance"},{emoji:"🏁",text:"Plant an imaginary flag at the summit!"}],timer:{mode:"countdown",seconds:60,label:"Summit in one minute!"},levelUp:"Cross carrying a cup of (pretend) mountain tea without spilling!"}]},Vk=[{title:"The First Spark",emoji:"✨"},{title:"The Bouncy Trail",emoji:"🦘"},{title:"The Brave Explorer",emoji:"🧭"},{title:"The Sparkle Badge",emoji:"🏅"},{title:"The Power-Up Path",emoji:"⚡"},{title:"The Clever Paws",emoji:"🐾"},{title:"The Big Challenge",emoji:"🎯"},{title:"The Shining Star",emoji:"🌟"},{title:"The Hero Road",emoji:"🛡️"},{title:"The Rainbow Leap",emoji:"🌈"},{title:"The Master Quest",emoji:"👑"},{title:"The Grand Festival",emoji:"🎪"}],Ik={calm:"Keep quests in a familiar, calm spot — same place, same little warm-up. Predictable feels powerful.",flex:"Mix up where you play — living room, garden, park. Fresh places keep quests exciting.",adventure:"Take quests outside, add music, make it loud and silly — big energy is the fuel!"},_k={1:"Short and sweet wins the week — stop each quest while it's still fun, and the spark grows.",2:"One quest a day is the perfect pace — steady
